<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sayfa bulunamadı | AICADBridge</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="dark light">
  <!-- Kendine yeten 404: kök dışı yollarda da CSS bağımlılığı olmasın -->
  <style>
    :root { --bg: #0a0a0b; --text-1: #ededef; --text-2: #a1a1aa; --line-2: #2e2e33; --accent: #00b8d4; --accent-ink: #00161a; }
    @media (prefers-color-scheme: light) { :root { --bg: #fafafa; --text-1: #111113; --text-2: #52525b; --line-2: #d4d4d9; } }
    * { box-sizing: border-box; margin: 0; }
    body { min-height: 100svh; display: grid; place-content: center; gap: 16px; text-align: center; padding: 48px 24px; background: var(--bg); color: var(--text-1); font: 14px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI Variable", "Segoe UI", Roboto, sans-serif; }
    .mark { width: 28px; height: 28px; margin: 0 auto 8px; border-radius: 50%; border: 4px solid var(--accent); box-shadow: inset 0 0 0 4px var(--bg), inset 0 0 0 14px var(--accent); }
    h1 { font-size: 28px; font-weight: 600; letter-spacing: -.01em; line-height: 1.15; }
    p { color: var(--text-2); max-width: 40ch; margin-inline: auto; }
    a { display: inline-block; justify-self: center; margin-top: 8px; padding: 8px 16px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); font-weight: 500; text-decoration: none; }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
<body>
  <span class="mark" aria-hidden="true"></span>
  <h1>Sayfa bulunamadı</h1>
  <p>Aradığın adres burada yok. Ana sayfaya dönebilirsin.</p>
  <a href="/aicadbridge-web/">Ana sayfaya dön</a>
</body>
</html>
