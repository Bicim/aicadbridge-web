<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sayfa bulunamadı | AICADBridge</title>
  <meta name="robots" content="noindex">
  <!-- Kendine yeten 404: kök dışı yollarda da CSS bağımlılığı olmasın -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100svh;
      display: grid;
      place-content: center;
      gap: 28px;
      text-align: center;
      padding: 48px 24px;
      background: #faf9f7;
      color: #16140f;
      font-family: Inter, -apple-system, "Segoe UI", sans-serif;
    }
    .mark {
      width: 56px; height: 56px;
      margin-inline: auto;
      border-radius: 14px;
      background: #0b0b0a;
      display: grid;
      place-content: center;
    }
    .mark svg { display: block; }
    h1 {
      font-family: "Instrument Serif", Georgia, serif;
      font-weight: 400;
      font-size: clamp(2.2rem, 7vw, 4rem);
      line-height: 1.05;
    }
    h1 em { font-style: italic; }
    p { color: #6d6558; max-width: 40ch; margin-inline: auto; }
    .cmd {
      font-family: ui-monospace, Consolas, monospace;
      font-size: .95rem;
      background: #ffffff;
      border: 1px solid rgba(22,20,15,.11);
      border-radius: 8px;
      padding: 12px 18px;
      display: inline-block;
    }
    .cmd b { color: #00748c; }
    a.btn {
      display: inline-block;
      background: #16140f;
      color: #faf9f7;
      text-decoration: none;
      font-weight: 600;
      font-size: .95rem;
      padding: 14px 26px;
      border-radius: 999px;
    }
    a.btn:hover { background: #00748c; }
  </style>
</head>
<body>
  <span class="mark" aria-hidden="true">
    <svg width="30" height="30" viewBox="0 0 32 32"><circle cx="16" cy="16" r="9" fill="none" stroke="#00b8d4" stroke-width="2.6"/><circle cx="16" cy="16" r="3" fill="#00b8d4"/></svg>
  </span>
  <h1>Bu sayfa <em>çizilemedi.</em></h1>
  <p>Aradığın adres bu modelde yok. Ana sayfaya dönüp komutla devam edebilirsin.</p>
  <span class="cmd"><b>404</b> · hedef gövde bulunamadı</span>
  <a class="btn" href="/">Ana sayfaya dön</a>
</body>
</html>
