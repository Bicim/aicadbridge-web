<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <!-- OG üretim kaynağı: 1200x630 tipografik kart. Ekran görüntüsü -> assets/images/og.png -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; }
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    body {
      background: #faf9f7;
      color: #16140f;
      font-family: Inter, -apple-system, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 72px 84px;
      position: relative;
    }
    /* Aksan yayı: ürün neon'u */
    body::before {
      content: "";
      position: absolute;
      right: -160px; bottom: -220px;
      width: 560px; height: 560px;
      border-radius: 50%;
      border: 2px solid rgba(0, 184, 212, .35);
    }
    body::after {
      content: "";
      position: absolute;
      right: -60px; bottom: -320px;
      width: 560px; height: 560px;
      border-radius: 50%;
      border: 2px solid rgba(0, 184, 212, .18);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: .02em;
      margin-bottom: 44px;
    }
    .brand svg { display: block; }
    .brand b { color: #00748c; font-weight: 600; }
    h1 {
      font-family: "Instrument Serif", Georgia, serif;
      font-weight: 400;
      font-size: 96px;
      line-height: 1.02;
      letter-spacing: -.015em;
      max-width: 10ch;
    }
    h1 em { font-style: italic; }
    .sub {
      margin-top: 26px;
      font-family: "Instrument Serif", Georgia, serif;
      font-style: italic;
      font-size: 34px;
      color: #6d6558;
    }
    .cmd {
      margin-top: 52px;
      display: inline-flex;
      align-items: baseline;
      gap: 14px;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 24px;
      background: #ffffff;
      border: 1px solid rgba(22, 20, 15, .11);
      border-radius: 10px;
      padding: 18px 26px;
      width: fit-content;
      box-shadow: 0 18px 40px -26px rgba(22, 20, 15, .35);
    }
    .cmd b { color: #00748c; }
    .cmd i {
      font-style: normal;
      display: inline-block;
      width: 13px; height: 26px;
      background: #00b8d4;
      transform: translateY(4px);
    }
  </style>
</head>
<body>
  <div class="brand">
    <svg width="40" height="40" viewBox="0 0 32 32"><rect width="32" height="32" rx="7" fill="#0b0b0a"/><circle cx="16" cy="16" r="9" fill="none" stroke="#00b8d4" stroke-width="2.6"/><circle cx="16" cy="16" r="3" fill="#00b8d4"/></svg>
    AICAD<b>Bridge</b>
  </div>
  <h1>Fusion 360'a <em>cümleyle konuş.</em></h1>
  <p class="sub">Sen niyeti yazarsın. Model, koddan değil cümleden başlasın.</p>
  <div class="cmd"><b>»</b> 50mm çapında, 80mm yüksekliğinde bir silindir çiz <i></i></div>
</body>
</html>
